version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./models:/app/models   # mount model weights (ไม่ต้อง bake ใน image)
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_BASE=http://api:8000   # ชื่อ service ใน Docker network
    depends_on:
      - api
    restart: unless-stopped
