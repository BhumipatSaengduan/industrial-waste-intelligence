version: "3.9"

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - TZ=Asia/Tokyo
    volumes:
      - ./models:/app/models
      - chroma_cache:/root/.cache/chroma
    depends_on:
      - ollama
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_BASE=http://api:8000
      - TZ=Asia/Tokyo
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_cache:
